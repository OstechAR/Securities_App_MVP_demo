<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#070707" />
<title>Aperture by Oakridge Partners</title>
<style>
:root{--bg:#070707;--s:#111214;--s2:#17181b;--b:#2b2c31;--gold:#b98a45;--gold2:#e3c58e;--iv:#f4ecdf;--t:#ece7de;--m:#9c9b98;--green:#85bd90;--red:#d08f8f;--blue:#8ca8c8;--shadow:0 18px 50px rgba(0,0,0,.48)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:470px;min-height:100vh;margin:auto;background:radial-gradient(circle at 50% -8%,rgba(185,138,69,.12),transparent 28%),linear-gradient(#090909,#070707)}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(11px + env(safe-area-inset-top)) 14px 11px;background:rgba(7,7,7,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(185,138,69,.15)}.brand{font:17px Georgia,serif;color:var(--gold2);letter-spacing:.13em}.status{font-size:10px;border:1px solid #435146;border-radius:999px;padding:5px 8px;color:#a6d1ad}.status.off{border-color:#5a3939;color:#d8a3a3}
main{padding:14px 13px 92px}.card,.soft{border:1px solid var(--b);background:linear-gradient(180deg,#151619,#101113);border-radius:20px;box-shadow:var(--shadow)}.soft{border-radius:16px;box-shadow:none}.hero{padding:24px 18px;background:radial-gradient(circle at 90% 0,rgba(185,138,69,.22),transparent 26%),linear-gradient(145deg,#19140f,#101113 55%,#090909)}
.ey{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);font-weight:900}.hero h1,h1,h2,h3{font-family:Georgia,serif;font-weight:500;color:var(--iv);margin:0}.hero h1{font-size:32px;line-height:1.05;margin-top:7px}h2{font-size:25px}h3{font-size:18px}.sub{font-size:12px;color:var(--m);line-height:1.5}.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:18px}.search input{min-width:0;border:1px solid #37383d;background:#0d0e10;color:var(--t);border-radius:13px;padding:13px;outline:none}.gold{border:0;border-radius:13px;padding:12px 14px;font-weight:900;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#19130b}.back{border:0;background:none;color:var(--gold2);padding:0 0 12px}.section{margin-top:20px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.tag{font-size:10px;padding:5px 8px;border:1px solid #58452c;color:var(--gold2);border-radius:999px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px}.metric .k{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--m)}.metric .v{font:19px Georgia,serif;color:var(--iv);margin-top:5px}.metric .note{font-size:9px;color:var(--m);margin-top:4px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btn{flex:1;border:1px solid #34353a;border-radius:12px;background:#141518;color:var(--t);padding:10px}.btn.active,.btn.goldline{border-color:#745933;color:var(--gold2);background:#17130e}.chart{padding:13px;margin-top:10px}.chartbox{height:245px;margin-top:8px;touch-action:none}.chartbox svg{width:100%;height:100%}.range{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.range button{padding:8px 2px;border:1px solid #303136;border-radius:9px;background:#111214;color:#aaa;font-size:10px}.range button.active{border-color:#735831;color:var(--gold2);background:#17130e}.context{margin-top:10px;padding:12px;border:1px solid #3b3023;background:#12100d;border-radius:15px}.contextgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.mini{padding:9px;border:1px solid #292a2e;border-radius:11px;background:#0c0d0f}.mini .k{font-size:9px;color:var(--m)}.mini .v{font-size:12px;font-weight:800;margin-top:3px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#bbb}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.search-results{margin-top:10px}.result{padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px}.result:hover{border-color:#5b4930}.ticker{font-weight:900}.name{font-size:11px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mapitem{padding:12px;margin-top:7px;display:flex;justify-content:space-between;align-items:center}.filing{padding:11px;margin-top:7px}.filing a{color:var(--gold2);text-decoration:none}.notice{padding:12px;border:1px solid #33353a;border-radius:14px;background:#0d0e10;color:var(--m);font-size:11px;line-height:1.5}.error{padding:12px;border:1px solid #633c3c;border-radius:14px;color:#e2a3a3;background:#160d0d}.loading{padding:18px;text-align:center;color:var(--m)}.spinner{width:22px;height:22px;border:2px solid #333;border-top-color:var(--gold2);border-radius:50%;margin:0 auto 8px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(470px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(9,9,9,.96);backdrop-filter:blur(15px);border-top:1px solid #25262a;padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:25}nav button{border:0;background:none;color:#777;font-size:9px;padding:7px 1px}nav button.active{color:var(--gold2)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:none}.sheetbg.show{display:block}.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(470px,100%);max-height:82vh;overflow:auto;background:#0d0e10;border:1px solid #323338;border-radius:24px 24px 0 0;padding:18px 14px 28px}.close{float:right;border:0;background:none;color:#bbb;font-size:20px}.aianswer{white-space:pre-wrap;font-size:12px;line-height:1.6;margin-top:10px}.mode{display:flex;gap:6px;margin-top:9px}.mode button{border:1px solid #34353a;border-radius:10px;background:#111214;color:#aaa;padding:8px 10px;font-size:10px}.mode button.active{color:var(--gold2);border-color:#735831}.divider{height:1px;background:#292a2e;margin:12px 0}

/* ===== Device-adaptive UI ===== */
.device-debug{font-size:9px;color:#777;margin-left:8px;letter-spacing:.08em;text-transform:uppercase}
.company-shell{display:block}.company-main,.company-side{min-width:0}.desktop-panel{display:none}
@media (min-width:768px){
  .app{max-width:1100px}.top{padding-left:22px;padding-right:22px}main{padding:20px 22px 100px}
  .hero{padding:34px 28px}.hero h1{font-size:40px}.grid{grid-template-columns:repeat(3,1fr)}
  .chartbox{height:320px}.company-shell.tablet{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,.8fr);gap:16px;align-items:start}
  .company-shell.tablet .company-side{position:sticky;top:78px}.company-shell.tablet .grid{grid-template-columns:1fr 1fr}
  nav{width:min(1100px,100%)}.sheet{width:min(720px,92%);border-radius:24px 24px 0 0}
}
@media (min-width:1200px){
  body{background:#050505}.app{max-width:1440px;margin:0 auto;padding-left:92px}.top{left:0;padding:16px 28px}
  main{padding:24px 30px 60px;max-width:none}.hero{max-width:980px;margin:30px auto}.hero h1{font-size:48px}
  nav{left:max(calc((100vw - 1440px)/2),0px);transform:none;top:0;bottom:0;width:92px;height:100vh;display:flex;flex-direction:column;justify-content:center;gap:8px;border-top:0;border-right:1px solid #25262a;padding:80px 8px 20px;background:rgba(8,8,8,.98)}
  nav button{padding:14px 3px;border-radius:10px}nav button.active{background:#17130e;border:1px solid #4e3c26}
  .company-shell.desktop{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(300px,.8fr);gap:20px;align-items:start}
  .company-shell.desktop .company-side{position:sticky;top:82px}.company-shell.desktop .grid{grid-template-columns:1fr 1fr}
  .chartbox{height:410px}.chart{padding:18px}.desktop-panel{display:block}.sheet{left:auto;right:24px;transform:none;bottom:24px;width:460px;max-height:86vh;border-radius:24px}
  .range button{padding:10px 4px}.btn{padding:11px 13px}.metric{padding:14px}
}
@media (max-width:767px){
  .app{max-width:100%}.chartbox{height:255px}.company-shell.mobile .grid{grid-template-columns:1fr 1fr}.company-shell.mobile .company-side{margin-top:18px}
  .range{overflow-x:auto;display:flex;padding-bottom:2px}.range button{min-width:48px;flex:1}.btnrow .btn{min-width:120px}
}

</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">APERTURE <span style="font:9px Arial,sans-serif;letter-spacing:.08em;color:#8f8a80">BY OAKRIDGE PARTNERS</span></div><div id="apiStatus" class="status off">API CHECK</div></div>
  <main id="screen"></main>
  <nav>
    <button data-nav="home" onclick="go('home')">HOME</button>
    <button data-nav="research" onclick="go('research')">RESEARCH</button>
    <button data-nav="compare" onclick="go('compare')">COMPARE</button>
    <button data-nav="valuation" onclick="go('valuation')">VALUE</button>
    <button data-nav="sources" onclick="go('sources')">SOURCES</button>
  </nav>
</div>
<div id="sheetBg" class="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><button class="close" onclick="closeSheet()">×</button><div id="sheet"></div></div></div>
<script>
const API_BASE = 'https://oakride-api.ericfrancaturner.workers.dev';
const RANGES = ['1D','1W','1M','1Y','5Y','10Y','ALL'];
function detectDeviceProfile(){const w=window.innerWidth,h=window.innerHeight,touch=matchMedia('(pointer: coarse)').matches,hover=matchMedia('(hover: hover)').matches;return{device:w<768?'mobile':w<1200?'tablet':'desktop',width:w,height:h,touch,hover,landscape:w>h}}
const state = {screen:'home',symbol:null,data:null,searchResults:[],range:'1Y',compareMode:'actual',rangeCache:{},selected:null,loading:false,device:detectDeviceProfile(),marketHistory:{status:'idle',range:'1Y',error:null}};
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const n=detectDeviceProfile(),o=state.device;if(n.device!==o.device||n.landscape!==o.landscape||n.touch!==o.touch){state.device=n;render();afterRender()}},140)});
const $=id=>document.getElementById(id);

async function api(path,opts={}){const r=await fetch(API_BASE+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({error:'Invalid API response'}));if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
async function health(){try{const d=await api('/api/health');$('apiStatus').className='status';$('apiStatus').textContent=d.priceProvider?(d.ai?'LIVE + AI':'LIVE DATA'):(d.ai?'SEC + AI':'SEC ONLY')}catch{$('apiStatus').className='status off';$('apiStatus').textContent='API OFFLINE'}}
function setNav(name){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===name))}
function go(screen){state.screen=screen;render();afterRender()}
function afterRender(){if(state.screen==='company'){if(state.marketHistory.status==='ready')requestAnimationFrame(()=>drawPriceChart(state.rangeCache[state.range]||[]));else if(state.marketHistory.status==='idle')requestAnimationFrame(()=>loadInitialMarketHistory())}if(state.screen==='compare')loadRangeAndDraw(state.range);if(state.screen==='valuation')loadValuationCharts()}
function render(){const s=$('screen');setNav(['company','search'].includes(state.screen)?'home':state.screen);if(state.loading){s.innerHTML=loading('Loading research data…');return}const fn={home,search:searchScreen,company,compare,valuation,research,sources};s.innerHTML=(fn[state.screen]||home)()}
function loading(t){return `<div class="loading"><div class="spinner"></div>${esc(t)}</div>`}

function home(){return `<section class="card hero"><div class="ey">Securities research · prototype</div><h1>Research. Understand.<br>Decide for yourself.</h1><p class="sub">Search a U.S. public company by ticker or name. Aperture organizes market data, SEC filings, financial history, valuation context, dividends and AI-assisted evidence review.</p><form class="search" onsubmit="event.preventDefault();runSearch(this.q.value)"><input name="q" placeholder="NVIDIA or NVDA" autocomplete="off"><button class="gold">SEARCH</button></form></section>${state.data?`<section class="section"><div class="head"><div><div class="ey">Continue research</div><h3>${esc(state.data.company.name)}</h3></div><span class="tag">${esc(state.data.symbol)}</span></div><button class="soft result" style="width:100%;color:inherit;text-align:left" onclick="go('company')"><div><div class="ticker">${esc(state.data.symbol)}</div><div class="name">${esc(state.data.company.name)}</div></div><span>›</span></button></section>`:''}`}
async function runSearch(q){q=String(q||'').trim();if(!q)return;state.loading=true;render();try{const d=await api('/api/search?q='+encodeURIComponent(q));state.searchResults=d.results||[];if(state.searchResults.length===1&&state.searchResults[0].symbol.toUpperCase()===q.toUpperCase()){await loadCompany(state.searchResults[0].symbol);return}state.screen='search'}catch(e){state.searchResults=[];state.searchError=e.message;state.screen='search'}finally{state.loading=false;render()}}
function searchScreen(){return `<button class="back" onclick="go('home')">← Home</button><div class="head"><div><div class="ey">Search results</div><h2>Companies</h2></div></div>${state.searchError?`<div class="error">${esc(state.searchError)}</div>`:''}<form class="search" onsubmit="event.preventDefault();runSearch(this.q.value)"><input name="q" placeholder="Ticker or company name"><button class="gold">SEARCH</button></form><div class="search-results">${state.searchResults.length?state.searchResults.map(r=>`<button class="soft result" style="width:100%;color:inherit;text-align:left" onclick="loadCompany('${js(r.symbol)}')"><div style="min-width:0"><div class="ticker">${esc(r.symbol)}</div><div class="name">${esc(r.name)}</div></div><span>›</span></button>`).join(''):`<div class="notice">No SEC-listed company matched that search.</div>`}</div>`}
async function loadCompany(symbol){state.loading=true;state.symbol=symbol;state.range='1Y';state.selected=null;state.rangeCache={};state.marketHistory={status:'idle',range:'1Y',error:null};render();try{state.data=await api('/api/company?symbol='+encodeURIComponent(symbol));state.screen='company';state.loading=false;render();await loadInitialMarketHistory()}catch(e){state.loading=false;state.screen='search';state.searchError=e.message;render()}}
async function loadInitialMarketHistory(){if(!state.symbol||state.marketHistory.status==='loading')return;const requestedRange=state.range;state.marketHistory={status:'loading',range:requestedRange,error:null};showChartLoading();try{const hist=await ensureRange(requestedRange);state.marketHistory={status:'ready',range:requestedRange,error:null};if(state.screen==='company'&&state.range===requestedRange)drawPriceChart(hist)}catch(e){state.marketHistory={status:'error',range:requestedRange,error:e.message};showChartError(e.message)}}
function showChartLoading(){const svg=$('priceChart');if(!svg)return;svg.setAttribute('viewBox','0 0 390 220');svg.innerHTML='<text x="195" y="110" text-anchor="middle" fill="#aaa">Loading market history…</text>'}
function showChartError(msg){const svg=$('priceChart');if(!svg)return;svg.setAttribute('viewBox','0 0 390 220');svg.innerHTML=`<text x="195" y="110" text-anchor="middle" fill="#d49a9a">${esc(msg||'Market history unavailable.')}</text>`}

function company(){const d=state.data;if(!d)return `<div class="notice">Search a company first.</div>`;const mode=state.device.device;return mode==='desktop'?companyDesktop(d):mode==='tablet'?companyTablet(d):companyMobile(d)}
function companyHeader(d){const q=d.market?.quote||{};return `<button class="back" onclick="go('home')">← Search</button><div class="head company-header"><div><div class="ey">${esc((d.company.exchanges||[])[0]||'SEC registrant')}</div><h2>${esc(d.company.name)}</h2><div class="sub">${esc(d.symbol)}${d.company.sicDescription?' · '+esc(d.company.sicDescription):''}</div></div><div style="text-align:right"><div style="font:24px Georgia,serif;color:var(--iv)">${money(q.close,2)}</div><div class="sub">${pct(q.percentChange)}</div></div></div>`}
function priceChartCard(d){return `<section class="card chart" style="margin-top:4px"><div class="head"><div><div class="ey">Market history</div><h3>${esc(d.symbol)} price · ${esc(state.range)}</h3></div><span class="tag">${state.device.touch?'Drag through time':'Hover / drag through time'}</span></div><div id="priceWrap" class="chartbox"><svg id="priceChart"></svg></div><div class="range">${RANGES.map(r=>`<button class="${state.range===r?'active':''}" onclick="setRange('${r}')">${r}</button>`).join('')}</div><div id="priceContext"></div><div class="btnrow" style="margin-top:10px"><button class="btn goldline" onclick="go('compare')">+ Compare Market Cap vs Assets</button><button class="btn" onclick="askPreset('Analyze the selected ${js(state.range)} market-price period for ${js(d.symbol)} using the supplied evidence. Describe the trend without giving investment advice.')">Analyze ${esc(state.range)}</button></div></section>`}
function snapshot(d){const a=d.analytics||{};return `<div class="head"><div><div class="ey">Company snapshot</div><h3>Key metrics</h3></div><span class="tag">${d.market?.available?'Market + SEC':'SEC data'}</span></div><div class="grid"><div class="soft metric"><div class="k">Market cap</div><div class="v">${compact(a.marketCap)}</div><div class="note">Price × reported shares</div></div><div class="soft metric"><div class="k">P/E</div><div class="v">${ratio(a.pe)}</div><div class="note">${esc(a.peBasis||'Unavailable')}</div></div><div class="soft metric"><div class="k">Dividend yield</div><div class="v">${a.dividendYield!=null?pct(a.dividendYield*100):'—'}</div><div class="note">SEC annual dividend / current price</div></div><div class="soft metric"><div class="k">Total assets</div><div class="v">${compact(a.totalAssets)}</div></div><div class="soft metric"><div class="k">Market / assets</div><div class="v">${ratio(a.marketToAssets)}</div><div class="note">Descriptive ratio</div></div><div class="soft metric"><div class="k">Shares outstanding</div><div class="v">${a.sharesOutstanding!=null?Number(a.sharesOutstanding).toLocaleString(undefined,{notation:'compact',maximumFractionDigits:2}):'—'}</div><div class="note">Latest reported</div></div></div>`}
function researchActions(){return `<div class="btnrow"><button class="btn goldline" onclick="go('research')">Research Map</button><button class="btn" onclick="go('valuation')">P/E & Dividends</button><button class="btn" onclick="askPreset('Summarize the latest reported financial and valuation context for this company.')">Ask Aperture</button></div>`}
function companyNotice(){return `<div class="notice">Metrics marked as calculated use reported SEC facts and market prices. They are research context, not investment recommendations.</div>`}
function companyMobile(d){return `${companyHeader(d)}<div class="company-shell mobile"><div class="company-main">${priceChartCard(d)}</div><div class="company-side"><section>${snapshot(d)}</section><section class="section">${researchActions()}</section><section class="section">${companyNotice()}</section></div></div>`}
function companyTablet(d){return `${companyHeader(d)}<div class="company-shell tablet"><div class="company-main">${priceChartCard(d)}<section class="section">${companyNotice()}</section></div><aside class="company-side"><section class="card" style="padding:14px">${snapshot(d)}</section><section class="section">${researchActions()}</section></aside></div>`}
function companyDesktop(d){return `${companyHeader(d)}<div class="company-shell desktop"><div class="company-main">${priceChartCard(d)}<section class="section">${companyNotice()}</section></div><aside class="company-side"><section class="card" style="padding:16px">${snapshot(d)}</section><section class="section">${researchActions()}</section><section class="section notice desktop-panel"><div class="ey">Desktop workspace</div><div style="margin-top:6px">Research controls stay beside the chart so market context remains visible while you move between research paths.</div></section></aside></div>`}

function research(){const d=state.data;if(!d)return noCompany();const items=[['Business','Business model, segments, industry and competition'],['Growth','Revenue, earnings and cash-flow growth'],['Profitability','Margins, returns and free cash flow'],['Financial Position','Assets, cash, debt, obligations and dilution'],['Valuation','Market cap, P/E, market/assets and historical valuation'],['Ownership & Capital','Shares, repurchases, dividends and ownership'],['Risks','Company disclosures and financial/legal exposure'],['Developments','Earnings, guidance, filings and corporate actions']];return `<button class="back" onclick="go('company')">← ${esc(d.symbol)}</button><div class="head"><div><div class="ey">Standard equity framework</div><h2>Research Map</h2></div></div>${items.map(([a,b])=>`<div class="soft mapitem" onclick="${a==='Valuation'||a==='Ownership & Capital'?"go('valuation')":a==='Financial Position'?"go('compare')":a==='Risks'?"askPreset('Summarize the latest material risk disclosures from the supplied filing evidence.')":"toast('This research path is mapped for a later build.')"}"><div><div class="ticker">${a}</div><div class="sub">${b}</div></div><span>›</span></div>`).join('')}<div class="section notice">The Research Map tracks standard areas explored. It does not judge whether research is complete or sufficient.</div>`}

function compare(){const d=state.data;if(!d)return noCompany();return `<button class="back" onclick="go('company')">← ${esc(d.symbol)}</button><div class="head"><div><div class="ey">Company value comparison</div><h2>Market Cap vs Total Assets</h2></div><span class="tag">${state.compareMode==='actual'?'USD':'Indexed'}</span></div><div class="mode"><button class="${state.compareMode==='actual'?'active':''}" onclick="setCompareMode('actual')">Actual Value</button><button class="${state.compareMode==='indexed'?'active':''}" onclick="setCompareMode('indexed')">Indexed Growth</button></div><section class="card chart"><div class="legend"><span><i class="dot" style="background:#e3c58e"></i>Market cap</span><span><i class="dot" style="background:#8ca8c8"></i>Total assets</span></div><div id="compareWrap" class="chartbox"><svg id="compareChart"></svg></div><div class="range">${RANGES.map(r=>`<button class="${state.range===r?'active':''}" onclick="setRange('${r}')">${r}</button>`).join('')}</div><div id="compareContext"></div></section><section class="section"><div class="head"><div><div class="ey">Selected period</div><h3>Trend Analysis</h3></div></div><div id="trendPanel" class="soft metric">Loading range data…</div></section><div class="section btnrow"><button class="btn goldline" onclick="analyzePeriod()">Analyze This Period</button><button class="btn" onclick="go('valuation')">P/E & Dividends</button></div><div class="section notice">For 1D, 1W and 1M, assets remain at the latest reported balance-sheet value while market cap moves with price. For longer ranges, Aperture aligns reported asset values and reported share counts to market prices near each reporting period. Co-movement does not establish causation.</div>`}
function setCompareMode(m){state.compareMode=m;render();loadRangeAndDraw(state.range)}
async function setRange(r){state.range=r;state.selected=null;state.marketHistory={status:'loading',range:r,error:null};render();showChartLoading();try{const hist=await ensureRange(r);state.marketHistory={status:'ready',range:r,error:null};if(state.screen==='company')drawPriceChart(hist);else if(state.screen==='compare')drawCompare(hist,r)}catch(e){state.marketHistory={status:'error',range:r,error:e.message};const target=state.screen==='company'?$('priceChart'):$('compareChart');if(target)target.innerHTML=`<text x="15" y="35" fill="#d49a9a">${esc(e.message)}</text>`}}
async function ensureRange(r){if(state.rangeCache[r]?.length)return state.rangeCache[r];const d=await api('/api/market-history?symbol='+encodeURIComponent(state.symbol)+'&range='+encodeURIComponent(r));state.rangeCache[r]=d.history||[];return state.rangeCache[r]}
async function loadRangeAndDraw(r){const panel=$('trendPanel');try{const hist=await ensureRange(r);if(state.screen!=='compare')return;drawCompare(hist,r)}catch(e){if($('compareChart'))$('compareChart').innerHTML=`<text x="15" y="35" fill="#d49a9a">${esc(e.message)}</text>`;if(panel)panel.textContent=e.message}}

function drawCompare(history,range){const svg=$('compareChart'),wrap=$('compareWrap');if(!svg||!wrap)return;if(!history?.length){svg.innerHTML='<text x="15" y="35" fill="#aaa">No market history available for this range.</text>';return}const d=state.data;const shares=instantSeries(d.financials.sharesOutstanding);const assets=instantSeries(d.financials.assets);const short=['1D','1W','1M'].includes(range);let series=[];
 if(short){const sh=latestAtOrBefore(shares,history.at(-1).date)?.value||d.analytics?.sharesOutstanding;const av=latestAtOrBefore(assets,history.at(-1).date)?.value||d.analytics?.totalAssets;if(!sh||!av){svg.innerHTML='<text x="15" y="35" fill="#aaa">Shares or asset data unavailable.</text>';return}series=history.map(p=>({date:p.datetime||p.date,marketCap:p.close*sh,assets:av,price:p.close,shares:sh}));}
 else{const relevantAssets=assets.filter(a=>withinRange(a.date,history[0].date,history.at(-1).date));for(const a of relevantAssets){const p=nearestByDate(history,a.date);const sh=latestAtOrBefore(shares,a.date);if(p&&sh?.value)series.push({date:a.date,marketCap:p.close*sh.value,assets:a.value,price:p.close,shares:sh.value});}}
 if(series.length<2){svg.innerHTML='<text x="15" y="35" fill="#aaa">Not enough overlapping history for this range.</text>';updateTrend(series);return}
 const raw=series.map(x=>({...x}));if(state.compareMode==='indexed'){const mb=series[0].marketCap,ab=series[0].assets;series=series.map(x=>({...x,marketCap:x.marketCap/mb*100,assets:x.assets/ab*100}))}
 const w=390,h=235,L=38,R=12,T=15,B=25;const vals=series.flatMap(x=>[x.marketCap,x.assets]).filter(Number.isFinite);let min=Math.min(...vals),max=Math.max(...vals);const pad=(max-min||Math.abs(max)||1)*.08;min-=pad;max+=pad;const times=series.map(x=>time(x.date));const t0=Math.min(...times),t1=Math.max(...times);const x=d=>L+(time(d)-t0)/(t1-t0||1)*(w-L-R);const y=v=>h-B-(v-min)/(max-min||1)*(h-T-B);const mp=series.map(s=>({...s,x:x(s.date),y:y(s.marketCap)}));const ap=series.map(s=>({...s,x:x(s.date),y:y(s.assets)}));const path=pts=>pts.map((p,i)=>`${i?'L':'M'} ${p.x},${p.y}`).join(' ');const si=Math.min(state.selected??series.length-1,series.length-1);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=`${[.25,.5,.75].map(n=>`<line x1="${L}" x2="${w-R}" y1="${T+(h-T-B)*n}" y2="${T+(h-T-B)*n}" stroke="#777" stroke-opacity=".13"/>`).join('')}<path d="${path(mp)}" fill="none" stroke="#e3c58e" stroke-width="3" stroke-linecap="round"/><path d="${path(ap)}" fill="none" stroke="#8ca8c8" stroke-width="3" stroke-linecap="round"/>${short?'':ap.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#8ca8c8"/>`).join('')}<line id="ccross" x1="${mp[si].x}" x2="${mp[si].x}" y1="${T}" y2="${h-B}" stroke="#eee" stroke-opacity=".45" stroke-dasharray="4 4"/><circle id="cdot" cx="${mp[si].x}" cy="${mp[si].y}" r="5.5" fill="#e3c58e" stroke="#111" stroke-width="2"/>`;
 function pick(clientX){const r=svg.getBoundingClientRect(),sx=(clientX-r.left)/r.width*w;let best=0,dist=Infinity;mp.forEach((p,i)=>{const z=Math.abs(p.x-sx);if(z<dist){dist=z;best=i}});state.selected=best;$('ccross')?.setAttribute('x1',mp[best].x);$('ccross')?.setAttribute('x2',mp[best].x);$('cdot')?.setAttribute('cx',mp[best].x);$('cdot')?.setAttribute('cy',mp[best].y);updateCompareContext(raw[best])}
 wrap.onpointerdown=e=>{wrap.setPointerCapture?.(e.pointerId);pick(e.clientX)};wrap.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')pick(e.clientX)};updateCompareContext(raw[si]);updateTrend(raw)}
function updateCompareContext(p){const el=$('compareContext');if(!el||!p)return;const r=p.assets?p.marketCap/p.assets:null;el.innerHTML=`<div class="context"><div class="ey">Time Context</div><div class="contextgrid"><div class="mini"><div class="k">Date</div><div class="v">${esc(String(p.date).slice(0,16))}</div></div><div class="mini"><div class="k">Market cap</div><div class="v">${compact(p.marketCap)}</div></div><div class="mini"><div class="k">Total assets</div><div class="v">${compact(p.assets)}</div></div><div class="mini"><div class="k">Market / assets</div><div class="v">${ratio(r)}</div></div></div><div class="btnrow" style="margin-top:10px"><button class="btn goldline" onclick="askPreset('Explain the market-cap and total-asset context around ${js(String(p.date).slice(0,10))}. Do not assume that changes in one caused changes in the other.', '${js(String(p.date).slice(0,10))}')">Ask Aperture</button></div></div>`}
function updateTrend(series){const el=$('trendPanel');if(!el)return;if(!series||series.length<2){el.innerHTML='<div class="sub">Not enough aligned observations to calculate a trend for this range.</div>';return}const a=series[0],b=series.at(-1);const mc=chg(a.marketCap,b.marketCap),ac=chg(a.assets,b.assets);const r0=a.marketCap/a.assets,r1=b.marketCap/b.assets;el.innerHTML=`<div class="grid"><div><div class="k">Market cap change</div><div class="v">${pct(mc)}</div></div><div><div class="k">Asset change</div><div class="v">${pct(ac)}</div></div><div><div class="k">Market/assets start</div><div class="v">${ratio(r0)}</div></div><div><div class="k">Market/assets end</div><div class="v">${ratio(r1)}</div></div></div><div class="sub" style="margin-top:9px">${trendSentence(mc,ac)}</div>`}
function analyzePeriod(){const panel=$('trendPanel');if(!panel)return;askPreset(`Analyze the selected ${state.range} period. Compare changes in market capitalization and reported total assets, describe the Market Cap / Assets ratio, and avoid causal or investment-advice claims.`,null,{range:state.range})}

function valuation(){const d=state.data;if(!d)return noCompany();const a=d.analytics||{};const div=d.financials?.dividendPerShare;return `<button class="back" onclick="go('company')">← ${esc(d.symbol)}</button><div class="head"><div><div class="ey">Valuation & shareholder returns</div><h2>P/E & Dividends</h2></div></div><div class="grid"><div class="soft metric"><div class="k">P/E</div><div class="v">${ratio(a.pe)}</div><div class="note">${esc(a.peBasis||'Unavailable')}</div></div><div class="soft metric"><div class="k">Annual dividend/share</div><div class="v">${money(a.dividendPerShareAnnual,2)}</div><div class="note">Latest SEC annual fact</div></div><div class="soft metric"><div class="k">Dividend yield</div><div class="v">${a.dividendYield!=null?pct(a.dividendYield*100):'—'}</div></div><div class="soft metric"><div class="k">Payout ratio</div><div class="v">${a.payoutRatio!=null?pct(a.payoutRatio*100):'—'}</div><div class="note">Dividend/share ÷ annual EPS</div></div></div><section class="card chart"><div class="head"><div><div class="ey">Historical valuation</div><h3>Annual P/E context</h3></div><span class="tag">Calculated</span></div><div id="peWrap" class="chartbox"><svg id="peChart"></svg></div><div class="notice">Historical P/E here uses market cap near fiscal year-end divided by reported annual net income. It is an annual valuation context series, not a forward P/E estimate.</div></section><section class="section"><div class="head"><div><div class="ey">Cash distributions</div><h3>Dividend History</h3></div></div>${dividendHistory(div)}</section>`}
async function loadValuationCharts(){try{const h=await ensureRange('10Y');if(state.screen==='valuation')drawPE(h)}catch(e){if($('peChart'))$('peChart').innerHTML=`<text x="15" y="35" fill="#d49a9a">${esc(e.message)}</text>`}}
function drawPE(history){const svg=$('peChart');if(!svg)return;const income=state.data.financials?.netIncome?.annual||[];const shares=instantSeries(state.data.financials?.sharesOutstanding);const pts=[];for(const n of income){const ni=Number(n.val);if(!(ni>0)||!n.end)continue;const p=nearestByDate(history,n.end),sh=latestAtOrBefore(shares,n.end);if(p&&sh?.value){const pe=(p.close*sh.value)/ni;if(Number.isFinite(pe)&&pe>0&&pe<500)pts.push({date:n.end,value:pe})}}drawSimpleSeries(svg,pts,'#e3c58e','×')}
function dividendHistory(metric){const q=metric?.quarterly||[],a=metric?.annual||[];const rows=(q.length?q:a).slice(-12).reverse();if(!rows.length)return `<div class="notice">No standardized dividend-per-share XBRL series was resolved for this issuer. A dedicated market-data dividend endpoint can be added if your provider plan supports it.</div>`;return rows.map(x=>`<div class="soft filing"><div class="head" style="margin:0"><div><div class="ticker">${money(x.val,3)} per share</div><div class="sub">${esc(x.end||'')} · ${esc(x.form||'')}</div></div><span class="tag">${esc(x.fp||'period')}</span></div></div>`).join('')}

function sources(){const d=state.data;if(!d)return noCompany();return `<button class="back" onclick="go('company')">← ${esc(d.symbol)}</button><div class="head"><div><div class="ey">Verification</div><h2>Sources</h2></div></div><div class="soft filing"><div class="ticker">SEC Company Facts</div><div class="sub">Structured XBRL facts used for financial metrics, shares and dividend fields.</div><a href="${d.sources.secCompanyFacts}" target="_blank" rel="noopener">Open source ↗</a></div><div class="soft filing"><div class="ticker">SEC Submissions</div><div class="sub">Registrant metadata and filing history.</div><a href="${d.sources.secSubmissions}" target="_blank" rel="noopener">Open source ↗</a></div>${d.market?.available?`<div class="soft filing"><div class="ticker">${esc(d.market.provider)}</div><div class="sub">Market quote and historical price data accessed server-side.</div><a href="${d.sources.marketProvider}" target="_blank" rel="noopener">Provider ↗</a></div>`:''}<section class="section"><div class="head"><div><div class="ey">Recent filings</div><h3>Original documents</h3></div></div>${(d.filings||[]).slice(0,18).map(f=>`<div class="soft filing"><div class="ticker">${esc(f.form)} · ${esc(f.filingDate||'')}</div><div class="sub">${esc(f.description||f.primaryDocument||'SEC filing')}</div>${f.url?`<a href="${f.url}" target="_blank" rel="noopener">Open filing ↗</a>`:''}</div>`).join('')}</section>`}

function drawPriceChart(historyOverride=null){const h=historyOverride||state.rangeCache[state.range]||[],svg=$('priceChart'),wrap=$('priceWrap');if(!svg||!wrap)return;if(!h.length){if(state.marketHistory.status==='loading'){showChartLoading();return}svg.innerHTML='<text x="15" y="35" fill="#aaa">Market history unavailable for this range.</text>';return}const pts=h.map(x=>({date:x.datetime||x.date,value:x.close,raw:x}));drawInteractiveSeries(svg,wrap,pts,state.selected??pts.length-1,i=>{state.selected=i;const p=pts[i];const evidenceDate=String(p.date).slice(0,10);const displayDate=String(p.date).replace('T',' ').replace('Z','');$('priceContext').innerHTML=`<div class="context"><div class="ey">Time Context · ${esc(state.range)}</div><div class="contextgrid"><div class="mini"><div class="k">Market time</div><div class="v">${esc(displayDate)}</div></div><div class="mini"><div class="k">Price</div><div class="v">${money(p.value,2)}</div></div></div><div class="btnrow" style="margin-top:9px"><button class="btn goldline" onclick="askPreset('What was happening around ${js(evidenceDate)}? Use supplied evidence and do not infer causation without support.','${js(evidenceDate)}')">What happened here?</button><button class="btn" onclick="go('compare')">Compare fundamentals</button></div></div>`})}
function drawInteractiveSeries(svg,wrap,points,selected,onSelect){const w=390,h=220,P=18,vals=points.map(p=>p.value),min=Math.min(...vals),max=Math.max(...vals),xy=points.map((p,i)=>({x:P+i*(w-2*P)/Math.max(1,points.length-1),y:h-P-(p.value-min)/(max-min||1)*(h-2*P),...p})),line=xy.map((p,i)=>`${i?'L':'M'} ${p.x},${p.y}`).join(' ');selected=Math.min(Math.max(0,selected),xy.length-1);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=`<path d="${line}" fill="none" stroke="#e3c58e" stroke-width="3" stroke-linecap="round"/><line id="pcross" x1="${xy[selected].x}" x2="${xy[selected].x}" y1="${P}" y2="${h-P}" stroke="#eee" stroke-opacity=".45" stroke-dasharray="4 4"/><circle id="pdot" cx="${xy[selected].x}" cy="${xy[selected].y}" r="5.5" fill="#e3c58e" stroke="#111" stroke-width="2"/>`;function pick(cx){const r=svg.getBoundingClientRect(),sx=(cx-r.left)/r.width*w;let b=0,d=Infinity;xy.forEach((p,i)=>{const z=Math.abs(p.x-sx);if(z<d){d=z;b=i}});$('pcross')?.setAttribute('x1',xy[b].x);$('pcross')?.setAttribute('x2',xy[b].x);$('pdot')?.setAttribute('cx',xy[b].x);$('pdot')?.setAttribute('cy',xy[b].y);onSelect(b)}wrap.onpointerdown=e=>{wrap.setPointerCapture?.(e.pointerId);pick(e.clientX)};wrap.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')pick(e.clientX)};onSelect(selected)}
function drawSimpleSeries(svg,pts,color,suffix=''){if(!pts.length){svg.innerHTML='<text x="15" y="35" fill="#aaa">Not enough historical data.</text>';return}const w=390,h=220,P=24,min=Math.min(...pts.map(p=>p.value)),max=Math.max(...pts.map(p=>p.value)),xy=pts.map((p,i)=>({x:P+i*(w-2*P)/Math.max(1,pts.length-1),y:h-P-(p.value-min)/(max-min||1)*(h-2*P),...p}));svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=`${[.25,.5,.75].map(n=>`<line x1="${P}" x2="${w-P}" y1="${P+(h-2*P)*n}" y2="${P+(h-2*P)*n}" stroke="#777" stroke-opacity=".13"/>`).join('')}<path d="${xy.map((p,i)=>`${i?'L':'M'} ${p.x},${p.y}`).join(' ')}" fill="none" stroke="${color}" stroke-width="3"/>${xy.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}"/><text x="${p.x}" y="${p.y-8}" text-anchor="middle" fill="#aaa" font-size="8">${p.value.toFixed(1)}${suffix}</text>`).join('')}`}

function instantSeries(metric){const arr=(metric?.instants?.length?metric.instants:[...(metric?.quarterly||[]),...(metric?.annual||[])]);const map=new Map();for(const x of arr){if(!x.end||!Number.isFinite(Number(x.val)))continue;map.set(x.end,{date:x.end,value:Number(x.val),raw:x})}return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date))}
function latestAtOrBefore(arr,date){let out=null;for(const x of arr){if(String(x.date).slice(0,10)<=String(date).slice(0,10))out=x;else break}return out||arr[0]||null}
function nearestByDate(arr,date){if(!arr?.length)return null;const t=time(date);let best=arr[0],d=Infinity;for(const x of arr){const z=Math.abs(time(x.datetime||x.date)-t);if(z<d){d=z;best=x}}return best}
function withinRange(d,a,b){const t=time(d);return t>=time(a)&&t<=time(b)}function time(d){const s=String(d||'');if(/^\d{4}-\d{2}-\d{2}$/.test(s))return new Date(s+'T00:00:00Z').getTime();const iso=s.replace(' ','T');return new Date(/Z$|[+-]\d{2}:?\d{2}$/.test(iso)?iso:iso+'Z').getTime()}
function chg(a,b){return a?((b/a)-1)*100:null}function trendSentence(mc,ac){if(mc==null||ac==null)return 'Insufficient data.';const diff=mc-ac;if(Math.abs(diff)<2)return 'Market capitalization and reported assets changed at broadly similar rates over the selected period.';return diff>0?'Market capitalization increased faster (or declined less) than reported total assets during the selected period.':'Reported total assets increased faster (or declined less) than market capitalization during the selected period.'}

function askPreset(question,selectedDate=null,context=null){openAiSheet(question,selectedDate,context)}
async function openAiSheet(question,selectedDate=null,context=null){$('sheetBg').classList.add('show');$('sheet').innerHTML=`<div class="ey">Ask Aperture</div><h2>${esc(state.symbol||'')}</h2><div class="notice" style="margin-top:10px">${esc(question)}</div><div id="aiResult" class="loading"><div class="spinner"></div>Reading evidence…</div>`;try{const d=await api('/api/ai',{method:'POST',body:JSON.stringify({symbol:state.symbol,question,selectedDate,selectedRange:state.range,context})});$('aiResult').className='aianswer';$('aiResult').textContent=d.answer}catch(e){$('aiResult').className='error';$('aiResult').textContent=e.message}}
function closeSheet(){$('sheetBg').classList.remove('show')}function toast(t){alert(t)}
function noCompany(){return `<div class="notice">Search a company first.</div>`}
function compact(v){if(v==null||!Number.isFinite(Number(v)))return'—';const n=Number(v),a=Math.abs(n);if(a>=1e12)return'$'+(n/1e12).toFixed(2)+'T';if(a>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(a>=1e6)return'$'+(n/1e6).toFixed(2)+'M';return'$'+n.toLocaleString()}
function money(v,d=2){if(v==null||!Number.isFinite(Number(v)))return'—';return'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function pct(v){if(v==null||!Number.isFinite(Number(v)))return'—';const n=Number(v);return(n>0?'+':'')+n.toFixed(2)+'%'}function ratio(v){if(v==null||!Number.isFinite(Number(v)))return'—';return Number(v).toFixed(2)+'×'}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function js(s){return String(s??'').replace(/['\\]/g,'')}

render();health();
</script>
