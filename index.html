<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#090a0d" />
<title>Oakridge Research Demo</title>
<style>
  :root{
    --bg:#08090c;--panel:#11141a;--gold:#c7a463;--gold2:#e0c58d;--cream:#f3ead7;
    --muted:#9ea4af;--line:#292f39;--green:#79c18b;--red:#d48686;--shadow:0 18px 50px rgba(0,0,0,.45);--radius:22px;
  }
  *{box-sizing:border-box} html,body{margin:0;background:#07080b;color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
  body{min-height:100vh} button,input{font:inherit} button{cursor:pointer}
  .app-shell{width:100%;max-width:430px;margin:0 auto;min-height:100vh;background:radial-gradient(circle at 50% 0%,rgba(199,164,99,.08),transparent 34%),var(--bg);position:relative;overflow:hidden;border-left:1px solid #11151b;border-right:1px solid #11151b}
  .topbar{position:sticky;top:0;z-index:40;background:rgba(8,9,12,.94);backdrop-filter:blur(16px);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid rgba(199,164,99,.09);display:flex;align-items:center;justify-content:space-between}
  .brand{font-family:Georgia,serif;letter-spacing:.08em;font-size:19px;color:var(--gold2)}
  .ghost-btn{border:1px solid var(--line);background:#0e1116;color:var(--cream);border-radius:14px;padding:9px 12px;font-size:12px}
  main{padding:18px 16px 110px}
  .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}
  h1,h2,h3{font-family:Georgia,serif;font-weight:600;margin:0} h1{font-size:31px;line-height:1.05} h2{font-size:24px} h3{font-size:18px}
  .sub{color:var(--muted);font-size:13px;line-height:1.55}
  .card{background:linear-gradient(180deg,rgba(22,25,32,.96),rgba(14,17,22,.96));border:1px solid #252a33;border-radius:var(--radius);box-shadow:var(--shadow)}
  .soft-card{background:#0e1116;border:1px solid #222832;border-radius:18px}
  .hero{padding:18px}.search{display:flex;gap:10px;margin:18px 0;width:100%;min-width:0}
  .search input{flex:1 1 auto;min-width:0;width:100%;background:#0c0f14;border:1px solid #2b313b;color:var(--cream);border-radius:16px;padding:15px 16px;outline:none}
  .search .gold-btn{flex:0 0 auto;max-width:34%;white-space:nowrap}
  .search input:focus{border-color:var(--gold)}
  .gold-btn{border:none;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#16120c;padding:13px 16px;border-radius:16px;font-weight:800;box-shadow:0 12px 30px rgba(199,164,99,.18)}
  .section{margin-top:22px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}
  .security-row{padding:14px;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;margin-bottom:9px}
  .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#252b34,#11151a);border:1px solid #313846;display:grid;place-items:center;color:var(--gold2);font-weight:800}
  .ticker{font-weight:800}.company{font-size:12px;color:var(--muted);margin-top:3px}.price{font-weight:700;text-align:right}.chg{font-size:12px;margin-top:3px}.positive{color:var(--green)}.negative{color:var(--red)}
  .tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;border:1px solid #2b313b;background:#0d1015;color:var(--muted);border-radius:999px;padding:9px 12px;font-size:12px}.tab.active{color:#16120c;background:var(--gold2);border-color:var(--gold2);font-weight:800}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{padding:14px}.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.metric .value{font-size:21px;margin-top:6px;font-family:Georgia,serif}.metric .note{font-size:11px;color:var(--muted);margin-top:4px}
  .chart-card{padding:14px;margin-top:14px}.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.chart-title{font-size:12px;color:var(--muted)}.big-number{font-family:Georgia,serif;font-size:28px;margin-top:3px}
  .chart-wrap{position:relative;height:220px;margin-top:8px;touch-action:none}svg.chart{width:100%;height:100%;display:block;overflow:visible}
  .context-card{padding:14px;margin-top:12px;border-color:#3b3427;background:linear-gradient(180deg,#17140f,#111318)}.context-date{color:var(--gold2);font-size:12px;text-transform:uppercase;letter-spacing:.12em}
  .context-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mini{padding:10px;background:#0b0e12;border:1px solid #232935;border-radius:14px}.mini .k{font-size:10px;color:var(--muted)}.mini .v{font-size:14px;margin-top:4px;font-weight:700}
  .event{padding:12px 0;border-top:1px solid #242a33}.event:first-child{border-top:none}.event-title{font-weight:700;font-size:13px}.event-desc{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}
  .cta-row{display:flex;gap:8px;margin-top:12px}.secondary-btn{flex:1;border:1px solid #343b46;background:#11151b;color:var(--cream);border-radius:14px;padding:12px 10px;font-size:12px}.secondary-btn.gold-outline{border-color:#6f5b35;color:var(--gold2)}
  .research-map{display:grid;gap:10px}.map-section{padding:14px}.map-section-head{display:flex;justify-content:space-between;align-items:center}.map-items{margin-top:10px}.map-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid #232934}.map-item:first-child{border-top:none}
  .status-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid #3c424c;color:var(--muted);font-size:11px}.status-dot.started{border-color:var(--gold);color:var(--gold2)}.status-dot.reviewed{background:var(--gold2);color:#14110b;border-color:var(--gold2);font-weight:800}
  .progress-note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:12px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #343943;border-radius:999px;padding:7px 10px;font-size:11px;color:var(--muted)}.gold-pill{border-color:#6f5b35;color:var(--gold2);background:rgba(199,164,99,.06)}
  .bottom-nav{position:fixed;z-index:45;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(9,10,13,.96);backdrop-filter:blur(16px);border-top:1px solid #1f242d;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .nav-btn{border:none;background:transparent;color:#777f8c;font-size:11px;padding:8px 4px}.nav-btn.active{color:var(--gold2)}.nav-icon{font-size:18px;display:block;margin-bottom:3px}
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:70;display:none}.sheet-backdrop.show{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;background:#0f1217;border:1px solid #2a3039;border-radius:26px 26px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px rgba(0,0,0,.6);max-height:86vh;overflow:auto}.handle{width:42px;height:4px;background:#39404b;border-radius:999px;margin:0 auto 14px}.sheet-action{width:100%;text-align:left;border:none;border-top:1px solid #242a33;background:transparent;color:var(--cream);padding:15px 4px;font-size:14px}.sheet-action:first-of-type{border-top:none}
  .ai-bubble{padding:14px;background:#11151c;border:1px solid #2a313d;border-radius:18px;margin-top:10px;line-height:1.55;font-size:13px}.ai-bubble.user{background:#18140e;border-color:#5f4f31}.ai-steps{display:grid;gap:8px;margin:12px 0}.ai-step{padding:10px 12px;border:1px solid #2b313b;border-radius:14px;color:var(--muted);font-size:12px}
  .source-card{padding:13px;margin-top:10px}.source-title{font-weight:700}.source-meta{font-size:11px;color:var(--muted);margin-top:4px}.source-highlight{margin-top:10px;border-left:2px solid var(--gold);padding-left:12px;color:#d7d1c5;font-size:12px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;background:#171b21;border:1px solid #343a44;color:var(--cream);padding:11px 14px;border-radius:14px;z-index:90;font-size:12px;transition:.25s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .timeline{position:relative;padding-left:16px}.timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1px;background:#3a3022}.timeline-item{position:relative;padding:0 0 18px 18px}.timeline-item:before{content:"";position:absolute;left:-15px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 4px rgba(199,164,99,.08)}
  .row{display:flex;gap:10px;align-items:center}.space{justify-content:space-between}.muted{color:var(--muted)}.hidden{display:none!important}.divider{height:1px;background:#222832;margin:14px 0}.screen-title{margin-bottom:14px}.back{border:none;background:transparent;color:var(--gold2);padding:4px 0;margin-bottom:10px}.tag{font-size:10px;color:var(--gold2);border:1px solid #5f4f31;border-radius:999px;padding:5px 8px}
  @media (max-width:380px){
    .search{gap:8px}
    .search input{padding:13px 12px;font-size:14px}
    .search .gold-btn{padding:13px 12px;font-size:13px;max-width:32%}
  }
  @media (min-width:700px){body{padding:24px 0}.app-shell{min-height:860px;border-radius:30px;box-shadow:0 30px 100px rgba(0,0,0,.6)}.bottom-nav{width:430px;bottom:24px;border-radius:0 0 30px 30px}}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar"><div class="brand">OAKRIDGE</div><button class="ghost-btn" onclick="openDemoSheet()">Demo</button></header>
  <main id="app"></main>
  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="home" onclick="go('home')"><span class="nav-icon">⌂</span>Home</button>
    <button class="nav-btn" data-nav="search" onclick="go('search')"><span class="nav-icon">⌕</span>Search</button>
    <button class="nav-btn" data-nav="research" onclick="go('research')"><span class="nav-icon">◫</span>Research</button>
    <button class="nav-btn" data-nav="watch" onclick="go('watch')"><span class="nav-icon">☆</span>Watchlist</button>
  </nav>
</div>
<div class="sheet-backdrop" id="sheetBackdrop" onclick="backdropClose(event)"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const companies=[
{ticker:'NVDA',name:'NVIDIA Corporation',price:'$138.85',chg:'+1.84%',positive:true},
{ticker:'AAPL',name:'Apple Inc.',price:'$234.12',chg:'+0.82%',positive:true},
{ticker:'MSFT',name:'Microsoft Corp.',price:'$507.33',chg:'+1.12%',positive:true},
{ticker:'AMZN',name:'Amazon.com Inc.',price:'$232.41',chg:'-0.44%',positive:false},
{ticker:'GOOGL',name:'Alphabet Inc.',price:'$198.76',chg:'+0.35%',positive:true},
{ticker:'TSLA',name:'Tesla Inc.',price:'$346.21',chg:'-1.07%',positive:false}
];
const timeline=[
{label:'Q1 2023',date:'2023-05-24',price:30,revenue:7.19,netIncome:2.04,margin:64.6,event:'Q1 earnings released',desc:'Data Center demand began accelerating as generative AI infrastructure spending increased.'},
{label:'Q2 2023',date:'2023-08-23',price:47,revenue:13.51,netIncome:6.19,margin:70.1,event:'Q2 earnings released',desc:'Revenue more than doubled sequentially as Data Center revenue expanded sharply.'},
{label:'Q3 2023',date:'2023-11-21',price:50,revenue:18.12,netIncome:9.24,margin:74.0,event:'Q3 earnings released',desc:'Data Center remained the primary contributor to quarterly growth.'},
{label:'Q4 2023',date:'2024-02-21',price:67,revenue:22.10,netIncome:12.29,margin:76.0,event:'Q4 earnings released',desc:'Revenue and gross margin continued expanding alongside accelerated computing demand.'},
{label:'Q1 2024',date:'2024-05-22',price:95,revenue:26.04,netIncome:14.88,margin:78.4,event:'Q1 earnings released',desc:'Data Center represented the large majority of revenue and continued strong growth.'},
{label:'Q2 2024',date:'2024-08-28',price:117,revenue:30.04,netIncome:16.60,margin:75.1,event:'Q2 earnings released',desc:'Revenue increased again, with Data Center remaining the largest segment.'},
{label:'Q3 2024',date:'2024-11-20',price:145,revenue:35.08,netIncome:19.31,margin:74.6,event:'Q3 earnings released',desc:'Quarterly revenue increased across key accelerated-computing products.'},
{label:'Q4 2024',date:'2025-02-26',price:131,revenue:39.33,netIncome:22.09,margin:73.0,event:'Q4 earnings released',desc:'Data Center growth continued while product transitions influenced margin mix.'},
{label:'Q1 2025',date:'2025-05-28',price:135,revenue:44.06,netIncome:18.78,margin:60.5,event:'Q1 earnings released',desc:'Revenue increased, while specific product and regulatory effects pressured reported margin.'},
{label:'Q2 2025',date:'2025-08-27',price:138.85,revenue:46.74,netIncome:26.42,margin:72.4,event:'Q2 earnings released',desc:'Revenue reached a new quarterly high in this demo dataset.'}
];
const revenueSegments=[
{name:'Data Center',share:88,value:'$41.1B'},
{name:'Gaming',share:8,value:'$3.8B'},
{name:'Professional Visualization',share:2,value:'$0.9B'},
{name:'Automotive & Other',share:2,value:'$0.9B'}
];
const aiResponses={
revenue:{title:'Why did revenue increase?',summary:'In this demo, the increase is primarily associated with higher Data Center revenue, with smaller contributions from Gaming and other segments.',bullets:['Data Center remained the dominant source of reported revenue.','The selected period shows another sequential increase in total company revenue.','The contribution mix remained heavily concentrated in accelerated-computing demand.']},
margin:{title:'What happened to gross margin?',summary:'The selected demo period shows gross margin moving with product mix, product-transition costs, and specific regulatory or inventory effects.',bullets:['Gross margin changed materially across the displayed quarters.','The selected quarter can be compared directly with the previous period.','Use the source view to inspect management discussion associated with the change.']},
risk:{title:'What risks changed?',summary:'The demo highlights changes in regulatory exposure, supply constraints, customer concentration, and competition-related disclosures.',bullets:['Export and regulatory restrictions can affect product availability by market.','Customer concentration can make results more sensitive to a smaller group of buyers.','Competitive and product-cycle risks remain important disclosure categories.']}
};
let state=JSON.parse(localStorage.getItem('oakridge-demo-state')||'null')||{screen:'home',selectedIndex:9,research:{business:'not',growth:'started',revenue:'reviewed',profitability:'not',financial:'not',valuation:'not',ownership:'not',risks:'started',developments:'not'},watchlist:['NVDA']};
function save(){localStorage.setItem('oakridge-demo-state',JSON.stringify(state))}
function setNav(name){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===name))}
function go(screen){state.screen=screen;save();render()}
function render(){
const app=document.getElementById('app'),s=state.screen;
if(s==='home'){setNav('home');app.innerHTML=homeView()}
else if(s==='search'){setNav('search');app.innerHTML=searchView()}
else if(s==='security'){setNav('home');app.innerHTML=securityView();requestAnimationFrame(()=>drawInteractiveChart('priceChart','price'))}
else if(s==='research'){setNav('research');app.innerHTML=researchMapView()}
else if(s==='revenue'){setNav('research');app.innerHTML=revenueView();requestAnimationFrame(()=>drawInteractiveChart('revenueChart','revenue'))}
else if(s==='segments'){setNav('research');app.innerHTML=segmentsView()}
else if(s==='valuation'){setNav('research');app.innerHTML=valuationView()}
else if(s==='risks'){setNav('research');app.innerHTML=risksView()}
else if(s==='developments'){setNav('research');app.innerHTML=developmentsView()}
else if(s==='watch'){setNav('watch');app.innerHTML=watchView()}
}
function homeView(){return `<section class="card hero"><div class="eyebrow">Securities research, simplified</div><h1>Research with context.</h1><p class="sub">Explore companies, move through their history, investigate what changed, and verify the evidence.</p><div class="search"><input id="homeSearch" placeholder="Search company or ticker"><button class="gold-btn" onclick="doSearch('homeSearch')">Search</button></div><div class="tabs"><button class="tab active">Popular</button><button class="tab">Watchlist</button><button class="tab">Markets</button></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Continue</div><h3>Your research</h3></div><span class="pill gold-pill">Demo mode</span></div><div class="card security-row" onclick="go('security')"><div class="logo">NV</div><div><div class="ticker">NVDA</div><div class="company">NVIDIA Corporation</div></div><div><div class="price">$138.85</div><div class="chg positive">Research active</div></div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Discover</div><h3>Popular securities</h3></div></div>${companies.slice(0,5).map(companyRow).join('')}</section>`}
function searchView(){return `<div class="screen-title"><div class="eyebrow">Search</div><h2>Find a company</h2></div><div class="search"><input id="searchInput" placeholder="Type NVDA, Apple, Microsoft..." oninput="filterSearch(this.value)"><button class="gold-btn" onclick="doSearch('searchInput')">Go</button></div><div id="searchResults">${companies.map(companyRow).join('')}</div>`}
function companyRow(c){return `<div class="soft-card security-row" onclick="${c.ticker==='NVDA'?"go('security')":"showToast('Supporting company preview only in this demo')"}"><div class="logo">${c.ticker.slice(0,2)}</div><div><div class="ticker">${c.ticker}</div><div class="company">${c.name}</div></div><div><div class="price">${c.price}</div><div class="chg ${c.positive?'positive':'negative'}">${c.chg}</div></div></div>`}
function doSearch(id){const q=(document.getElementById(id)?.value||'').toUpperCase();if(q.includes('NVDA')||q.includes('NVIDIA'))go('security');else showToast('Try NVDA for the full demo experience')}
function filterSearch(q){document.getElementById('searchResults').innerHTML=companies.filter(c=>(c.ticker+c.name).toLowerCase().includes(q.toLowerCase())).map(companyRow).join('')||'<p class="sub">No matching demo company.</p>'}
function securityView(){const t=timeline[state.selectedIndex];return `<button class="back" onclick="go('home')">← Home</button><div class="row space"><div><div class="eyebrow">NASDAQ</div><h2>NVIDIA Corporation</h2><div class="sub">NVDA</div></div><button class="ghost-btn" onclick="showToast('NVDA saved to watchlist')">☆</button></div><div class="card chart-card"><div class="chart-head"><div><div class="chart-title">Share price</div><div class="big-number">$${t.price.toFixed(2)}</div><div class="sub">${t.label}</div></div><span class="tag">Drag chart</span></div><div class="chart-wrap"><svg id="priceChart" class="chart"></svg></div>${timeContext(t,'price')}</div><div class="metric-grid"><div class="soft-card metric"><div class="label">Revenue</div><div class="value">$46.7B</div><div class="note">Demo selected period</div></div><div class="soft-card metric"><div class="label">Gross margin</div><div class="value">72.4%</div><div class="note">Demo selected period</div></div><div class="soft-card metric"><div class="label">Net income</div><div class="value">$26.4B</div><div class="note">Demo selected period</div></div><div class="soft-card metric"><div class="label">Market cap</div><div class="value">$3.4T</div><div class="note">Illustrative snapshot</div></div></div><section class="section"><div class="section-head"><div><div class="eyebrow">Navigate</div><h3>Research Map</h3></div><button class="ghost-btn" onclick="go('research')">Open</button></div><div class="card hero"><p class="sub">Track which areas of the standard framework you have explored, without judging whether your research is sufficient.</p></div></section>`}
function timeContext(t,kind){return `<div class="soft-card context-card"><div class="context-date">${t.label} · ${t.date}</div><div class="context-metrics"><div class="mini"><div class="k">Price</div><div class="v">$${t.price.toFixed(2)}</div></div><div class="mini"><div class="k">Revenue</div><div class="v">$${t.revenue.toFixed(2)}B</div></div><div class="mini"><div class="k">Gross margin</div><div class="v">${t.margin.toFixed(1)}%</div></div></div><div class="divider"></div><div class="eyebrow">What was happening?</div><div class="event"><div class="event-title">${t.event}</div><div class="event-desc">${t.desc}</div></div><div class="cta-row"><button class="secondary-btn gold-outline" onclick="openInvestigate('${kind}')">Investigate</button><button class="secondary-btn" onclick="openAI('revenue')">Ask Oakridge</button></div></div>`}
function researchMapView(){const items=[['business','Business',['Business Model','Revenue Sources','Segments']],['growth','Growth',['Revenue Growth','Segment Growth','Earnings Growth']],['profitability','Profitability',['Gross Margin','Operating Margin','Net Margin']],['financial','Financial Position',['Cash & Liquidity','Debt','Debt Servicing']],['valuation','Valuation',['Market Value','Historical Valuation','Peer Valuation']],['ownership','Ownership & Capital',['Share Structure','Insider Ownership','Institutional Ownership']],['risks','Risks',['Company Disclosures','Financial Risks','Regulatory / Legal']],['developments','Developments',['Earnings','Guidance','Filings']]];return `<button class="back" onclick="go('security')">← NVIDIA</button><div class="screen-title"><div class="eyebrow">Standard equity framework</div><h2>Research Map</h2></div><div class="research-map">${items.map(([k,t,s])=>mapSection(k,t,s)).join('')}</div><p class="progress-note">Research Map tracks areas explored within the Oakridge framework. It does not assess the quality or sufficiency of investment research.</p>`}
function mapSection(key,title,subs){const st=state.research[key]||'not';const action=key==='growth'?"go('revenue')":key==='valuation'?"go('valuation')":key==='risks'?"go('risks')":key==='developments'?"go('developments')":"showToast('This section is visual-only in the demo')";return `<div class="soft-card map-section"><div class="map-section-head"><h3>${title}</h3>${statusBadge(st)}</div><div class="map-items">${subs.map((x,i)=>`<div class="map-item" onclick="${i===0?action:"showToast('Demo subsection')"}"><span>${x}</span><span class="muted">›</span></div>`).join('')}</div></div>`}
function statusBadge(st){return st==='reviewed'?'<span class="status-dot reviewed">✓</span>':st==='started'?'<span class="status-dot started">◐</span>':'<span class="status-dot">○</span>'}
function revenueView(){state.research.growth='started';state.research.revenue='reviewed';save();const t=timeline[state.selectedIndex];return `<button class="back" onclick="go('research')">← Research Map</button><div class="row space"><div><div class="eyebrow">Growth</div><h2>Revenue</h2></div><span class="pill gold-pill">Reviewed</span></div><div class="card chart-card"><div class="chart-head"><div><div class="chart-title">Quarterly revenue</div><div class="big-number">$${t.revenue.toFixed(2)}B</div><div class="sub">${t.label}</div></div><span class="tag">Drag through time</span></div><div class="chart-wrap"><svg id="revenueChart" class="chart"></svg></div>${timeContext(t,'revenue')}</div><div class="cta-row"><button class="secondary-btn gold-outline" onclick="go('segments')">Break down revenue</button><button class="secondary-btn" onclick="openAI('revenue')">Ask Oakridge</button></div>`}
function segmentsView(){return `<button class="back" onclick="go('revenue')">← Revenue</button><div class="screen-title"><div class="eyebrow">Breakdown</div><h2>Revenue by segment</h2><p class="sub">Illustrative composition for the selected demo period.</p></div><div class="card hero">${revenueSegments.map(s=>`<div class="event"><div class="row space"><div class="event-title">${s.name}</div><div>${s.value}</div></div><div class="sub" style="margin-top:6px">${s.share}% of total</div><div style="height:8px;background:#222832;border-radius:999px;margin-top:8px;overflow:hidden"><div style="width:${s.share}%;height:100%;background:linear-gradient(90deg,#8f7341,#e0c58d)"></div></div></div>`).join('')}</div><div class="cta-row"><button class="secondary-btn gold-outline" onclick="openInvestigate('segments')">Investigate segment mix</button><button class="secondary-btn" onclick="openSource()">View source</button></div>`}
function valuationView(){state.research.valuation='started';save();return `<button class="back" onclick="go('research')">← Research Map</button><div class="screen-title"><div class="eyebrow">Valuation</div><h2>Historical context</h2><p class="sub">The demo shows relative position without labeling the security cheap or expensive.</p></div><div class="card hero"><div class="metric-grid"><div class="soft-card metric"><div class="label">Current P/E</div><div class="value">41.8×</div></div><div class="soft-card metric"><div class="label">5Y median</div><div class="value">38.4×</div></div></div><div style="margin-top:22px"><div class="row space"><span class="sub">Low 14×</span><span class="sub">High 74×</span></div><div style="height:12px;background:#222832;border-radius:999px;margin-top:8px;position:relative"><div style="position:absolute;left:46%;top:-5px;width:2px;height:22px;background:var(--gold2)"></div></div></div></div><div class="cta-row"><button class="secondary-btn gold-outline" onclick="openInvestigate('valuation')">Investigate</button><button class="secondary-btn" onclick="showToast('Peer comparison preview')">Compare peers</button></div>`}
function risksView(){state.research.risks='started';save();const risks=[['Regulatory / export exposure','Restrictions and regulatory changes can affect products, customers, and addressable markets.'],['Customer concentration','A smaller group of large customers can materially influence reported results.'],['Supply and product transitions','Availability, manufacturing capacity, and product transitions can affect timing and margins.'],['Competition','Competing architectures, chips, and platforms can affect demand and pricing.']];return `<button class="back" onclick="go('research')">← Research Map</button><div class="screen-title"><div class="eyebrow">Disclosed risk categories</div><h2>Risks</h2><p class="sub">Evidence organized from company disclosures. No proprietary risk score.</p></div>${risks.map(r=>`<div class="soft-card hero" style="margin-bottom:10px"><div class="event-title">${r[0]}</div><div class="event-desc">${r[1]}</div></div>`).join('')}<div class="cta-row"><button class="secondary-btn gold-outline" onclick="openAI('risk')">Ask what changed</button><button class="secondary-btn" onclick="openSource()">Compare filings</button></div>`}
function developmentsView(){state.research.developments='started';save();return `<button class="back" onclick="go('research')">← Research Map</button><div class="screen-title"><div class="eyebrow">Company history</div><h2>Developments</h2><p class="sub">A unified timeline linking events back to relevant research areas.</p></div><div class="card hero"><div class="timeline">${timeline.slice().reverse().slice(0,7).map(t=>`<div class="timeline-item"><div class="tag">${t.label}</div><div class="event-title" style="margin-top:7px">${t.event}</div><div class="event-desc">${t.desc}</div></div>`).join('')}</div></div>`}
function watchView(){return `<div class="screen-title"><div class="eyebrow">Watchlist</div><h2>Saved securities</h2></div>${companyRow(companies[0])}<div class="card hero"><p class="sub">Watchlists are stored locally in this self-contained demo.</p></div>`}
function drawInteractiveChart(id,key){
const svg=document.getElementById(id);if(!svg)return;const w=360,h=210,pad=18,vals=timeline.map(d=>d[key]),min=Math.min(...vals),max=Math.max(...vals);
const pts=timeline.map((d,i)=>({x:pad+i*(w-2*pad)/(timeline.length-1),y:h-pad-((d[key]-min)/(max-min||1))*(h-2*pad)}));const path=pts.map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' '),area=`${path} L ${pts.at(-1).x},${h-pad} L ${pts[0].x},${h-pad} Z`;
svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=`<defs><linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c7a463" stop-opacity=".28"/><stop offset="100%" stop-color="#c7a463" stop-opacity="0"/></linearGradient></defs><g opacity=".22">${[.25,.5,.75].map(v=>`<line x1="${pad}" x2="${w-pad}" y1="${pad+(h-2*pad)*v}" y2="${pad+(h-2*pad)*v}" stroke="#626a76" stroke-width="1"/>`).join('')}</g><path d="${area}" fill="url(#g-${id})"/><path d="${path}" fill="none" stroke="#dfc58f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${i===state.selectedIndex?5:2.5}" fill="${i===state.selectedIndex?'#f2dfb8':'#967a46'}"/>`).join('')}<line x1="${pts[state.selectedIndex].x}" x2="${pts[state.selectedIndex].x}" y1="${pad}" y2="${h-pad}" stroke="#d9c082" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="${pts[state.selectedIndex].x}" cy="${pts[state.selectedIndex].y}" r="6" fill="#f2dfb8" stroke="#7b6337" stroke-width="2"/>`;
const wrap=svg.parentElement;function handle(clientX){const rect=svg.getBoundingClientRect(),local=(clientX-rect.left)/rect.width*w;let best=0,dist=Infinity;pts.forEach((p,i)=>{const d=Math.abs(p.x-local);if(d<dist){dist=d;best=i}});if(best!==state.selectedIndex){state.selectedIndex=best;save();render()}}
wrap.onpointerdown=e=>{wrap.setPointerCapture?.(e.pointerId);handle(e.clientX)};wrap.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')handle(e.clientX)}
}
function openInvestigate(kind){const opts=kind==='revenue'?[['Show historical data',()=>closeSheet()],['Break this down',()=>{closeSheet();go('segments')}],['Compare previous period',()=>openCompare()],['What changed?',()=>openAI('revenue')],['Ask Oakridge',()=>openAI('revenue')],['View source',()=>openSource()]]:[['Show history',()=>showToast('Historical view preview')],['Compare',()=>showToast('Comparison preview')],['Ask Oakridge',()=>openAI(kind==='valuation'?'revenue':'margin')],['View source',()=>openSource()]];showSheet(`<div class="handle"></div><div class="eyebrow">Investigate</div><h2 style="margin-bottom:8px">${kind[0].toUpperCase()+kind.slice(1)}</h2>${opts.map((o,i)=>`<button class="sheet-action" onclick="sheetActions[${i}]()">${o[0]} <span style="float:right">›</span></button>`).join('')}`);window.sheetActions=opts.map(o=>o[1])}
function openCompare(){const i=state.selectedIndex,prev=Math.max(0,i-1),a=timeline[prev],b=timeline[i];showSheet(`<div class="handle"></div><div class="eyebrow">Compare previous</div><h2>${a.label} vs ${b.label}</h2>${compareRow('Revenue','$'+a.revenue.toFixed(2)+'B','$'+b.revenue.toFixed(2)+'B')}${compareRow('Gross margin',a.margin.toFixed(1)+'%',b.margin.toFixed(1)+'%')}${compareRow('Net income','$'+a.netIncome.toFixed(2)+'B','$'+b.netIncome.toFixed(2)+'B')}<button class="gold-btn" style="width:100%;margin-top:14px" onclick="openAI('revenue')">What changed?</button>`)}
function compareRow(label,a,b){return `<div class="event"><div class="event-title">${label}</div><div class="row space" style="margin-top:8px"><span class="muted">${a}</span><span style="color:var(--gold2)">→</span><strong>${b}</strong></div></div>`}
function openAI(type){closeSheet();const resp=aiResponses[type]||aiResponses.revenue;showSheet(`<div class="handle"></div><div class="eyebrow">Ask Oakridge</div><h2>${resp.title}</h2><div class="ai-bubble user">${resp.title}</div><div id="aiLoading" class="ai-steps"><div class="ai-step">✦ Analyzing selected period...</div><div class="ai-step">✦ Comparing reported metrics...</div><div class="ai-step">✦ Reviewing linked disclosures...</div></div><div id="aiAnswer" class="hidden"><div class="ai-bubble">${resp.summary}<ul>${resp.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></div><div class="source-card soft-card" onclick="openSource()"><div class="source-title">Source-linked response</div><div class="source-meta">Quarterly filing · Earnings release</div><div class="source-highlight">Tap to inspect the supporting source view.</div></div></div>`);setTimeout(()=>{document.getElementById('aiLoading')?.classList.add('hidden');document.getElementById('aiAnswer')?.classList.remove('hidden')},1200)}
function openSource(){showSheet(`<div class="handle"></div><div class="eyebrow">Source</div><h2>NVIDIA Corporation</h2><div class="source-card soft-card"><div class="source-title">Quarterly filing · Demo source</div><div class="source-meta">Selected period · Form 10-Q style source view</div><div class="source-highlight">This self-contained prototype uses summarized demo evidence rather than live filing retrieval. In production, this card would link directly to the underlying filing and highlighted supporting section.</div></div><button class="secondary-btn" style="width:100%;margin-top:12px" onclick="showToast('Original filing link would open here')">View original</button>`)}
function openDemoSheet(){showSheet(`<div class="handle"></div><div class="eyebrow">Presentation controls</div><h2>Demo Mode</h2><button class="sheet-action" onclick="resetDemo()">Reset entire demo</button><button class="sheet-action" onclick="go('security');closeSheet()">Jump to NVIDIA overview</button><button class="sheet-action" onclick="go('research');closeSheet()">Jump to Research Map</button><button class="sheet-action" onclick="go('revenue');closeSheet()">Jump to Revenue demo</button><button class="sheet-action" onclick="document.documentElement.requestFullscreen?.();closeSheet()">Enter fullscreen</button>`)}
function resetDemo(){localStorage.removeItem('oakridge-demo-state');state={screen:'home',selectedIndex:9,research:{business:'not',growth:'started',revenue:'reviewed',profitability:'not',financial:'not',valuation:'not',ownership:'not',risks:'started',developments:'not'},watchlist:['NVDA']};closeSheet();render();showToast('Demo reset')}
function showSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('sheetBackdrop').classList.add('show')}
function closeSheet(){document.getElementById('sheetBackdrop').classList.remove('show')}
function backdropClose(e){if(e.target.id==='sheetBackdrop')closeSheet()}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
render();
</script>
</body>
</html>
